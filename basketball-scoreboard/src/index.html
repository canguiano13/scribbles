<!DOCTYPE HTML>
<html>
    <head>
        <title>Basketball scoreboard</title>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <div class="container">
            <div class="team-section">
                <h3 class="team-name">HOME</h3>
                <div class="score-container"><h1 class="score" id="home-score">0</h1></div>
                <div class="btn-container">
                    <button class="btn" onclick="updateHome(1)">+1</button>
                    <button class="btn" onclick="updateHome(2)">+2</button>
                    <button class="btn" onclick="updateHome(3)">+3</button>
                </div>
            </div>
            <div class="team-section">
                <h3 class="team-name">GUEST</h3>
                <div class="score-container"><h1 class="score" id="guest-score">0</h1></div>
                <div class="btn-container">
                    <button class="btn" onclick="updateGuest(1)">+1</button>
                    <button class="btn" onclick="updateGuest(2)">+2</button>
                    <button class="btn" onclick="updateGuest(3)">+3</button>
                </div>
            </div>
        </div>

        <script src="index.js"></script>
    </body>
</html>
