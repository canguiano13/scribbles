<!DOCTYPE HTML>
<html>
    <head>
        <title>Single player blackjack</title>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <h1 id="header">Blackjack</h1>
        <p class="italic" id="message-el">Want to play a round? Cost per game: $100</p>
        <p id="cards-el">Cards: </p>
        <p id="sum-el">Sum: </p>
        <button class="btn" onclick="drawCard()">DRAW CARD</button>
        <button class="btn" onclick="newGame()">NEW GAME</button>
        <p id="player-el"></p>

        <script src="index.js"></script>
    </body>
</html>
