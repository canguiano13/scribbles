<!DOCTYPE HTML>
<html>
    <head>
        <title>Unit Converter</title>
        <link rel="stylesheet" href="index.css">
    </head>

    <body>
        <div id="main">
        <div id="top-section">
            <h1>Metric/Imperial Unit Conversion</h1>
            <input type="text"id="input-box" placeholder="-"/>
            <button id="convert-btn">Convert</button>
        </div>

        <div id="bottom-section">
            <div class="conversion-section">
                <h2>Length (Meter/Feet)</h2>
                <p class="conversion" id="length-conversion">20 meters = 65.616 feet | 20 feet = 6.096 meters</p>
            </div>
            <div class="conversion-section">
                <h2>Volume (Liters/Gallons)</h2>
                <p class="conversion" id="volume-conversion">20 liters = 5.284 gallons | 20 gallons = 75.708 liters</p>
            </div>
            <div class="conversion-section">
                <h2>Mass (Kilograms/Pounds)</h2>
                <p class="conversion" id="mass-conversion">20 kilos = 44.092 pounds | 20 pounds = 9.072 kilos</p>
            </div>
        </div>
        </div>

        <script src="index.js"></script>
    </body>
</html>
